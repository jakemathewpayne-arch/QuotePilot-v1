<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#092119"><link rel="manifest" href="manifest.webmanifest"><title>QuotePilot AI</title><link rel="icon" href="icon.svg">
<style>:root{font-family:system-ui,Arial;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#061811;color:#ebfff1;min-height:100dvh;display:grid;place-items:center;padding:16px}.app{background:#123025;border:1px solid #39624f;border-radius:24px;padding:22px;width:min(100%,490px);box-shadow:0 12px 60px #0006}h1{font-size:23px;margin:0}.sub{color:#bbd4c5;font-size:13px}.orb{width:110px;height:110px;background:#208355;border-radius:50%;display:grid;place-items:center;margin:28px auto 12px;font-size:45px}.orb.active{box-shadow:0 0 0 11px #2b92502f}#status{text-align:center;font-size:19px;font-weight:700}#hint{text-align:center;font-size:13px;color:#b2cabd;min-height:38px;margin:9px 0 13px}.buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{border:0;border-radius:24px;background:#4bdd94;color:#032218;font:700 15px system-ui;padding:13px 19px;cursor:pointer}button.secondary{background:#315744;color:#fff}button.danger{background:#9e4653;color:#fff}#log{height:180px;overflow:auto;background:#081d15;border:1px solid #2f5242;border-radius:14px;padding:12px;margin-top:20px;font-size:14px}.msg{margin:0 0 12px}.msg b{display:block;font-size:11px;color:#7cd9ab;margin-bottom:3px}.entry{display:flex;gap:7px;margin-top:12px}.entry input{flex:1;min-width:0;background:#061a13;color:#fff;border:1px solid #426653;border-radius:20px;padding:12px}.entry button{font-size:13px;padding:10px 14px}#diag{white-space:pre-wrap;color:#b2cabd;font-size:12px;margin-top:14px}button[hidden]{display:none}small{display:block;margin-top:10px;color:#b2cabd}</style></head>
<body><main class="app"><h1>QuotePilot AI</h1><span class="sub">Voice receptionist · test preview</span><div style="margin-top:15px"><button id="install" class="secondary" hidden>Install App</button><small id="installhelp">In Chrome, use ⋮ → Add to Home screen / Install app.</small></div><div id="orb" class="orb">🎙️</div><div id="status">Ready to talk</div><div id="hint">Tap Start Conversation to begin.</div><div class="buttons"><button id="start">Start Conversation</button><button id="talk" class="secondary" hidden>🎤 Talk Again</button><button id="end" class="danger" hidden>End Call</button></div><div id="log" role="log"><div class="msg">Your conversation will appear here.</div></div><div class="entry"><input id="message" placeholder="Or type a message" aria-label="Type a message"><button id="send" class="secondary">Send</button></div><div id="diag"></div></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),SR=window.SpeechRecognition||window.webkitSpeechRecognition;let active=false,rec=null,speaking=false,listening=false,tries=0,turn=0,guard=0,timer=0,installer=null;const set=(a,b)=>{$('status').textContent=a;$('hint').textContent=b||''};function note(t){$('diag').textContent=t}function log(w,t){let d=document.createElement('div');d.className='msg';let b=document.createElement('b');b.textContent=w;let s=document.createElement('span');s.textContent=t;d.append(b,s);$('log').append(d);$('log').scrollTop=$('log').scrollHeight}function buttons(){ $('start').hidden=active;$('end').hidden=!active;$('talk').hidden=!active}function stopRec(){if(rec){let r=rec;rec=null;r.onend=r.onerror=r.onresult=null;try{r.abort()}catch(e){}}listening=false}function later(ms){clearTimeout(timer);if(active&&!speaking)timer=setTimeout(listen,ms)}function finished(n){if(!active||turn!==n||!speaking)return;clearTimeout(guard);speaking=false;set('Listening…','Speak after the microphone activates');later(350)}function speak(t){log('QuotePilot',t);stopRec();speaking=true;set('Speaking…','QuotePilot is replying out loud');let n=++turn;try{if(!window.speechSynthesis)throw Error('Speech playback unavailable');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-NZ';u.rate=.93;u.pitch=1.03;u.volume=1;const voices=speechSynthesis.getVoices();const preferred=voices.find(v=>v.lang.toLowerCase()==='en-nz'&&/natural|google|samsung|female|premium/i.test(v.name))||voices.find(v=>v.lang.toLowerCase()==='en-nz')||voices.find(v=>/^en-(au|gb)/i.test(v.lang)&&/google|natural/i.test(v.name))||voices.find(v=>/^en/i.test(v.lang));if(preferred)u.voice=preferred;u.onend=()=>finished(n);u.onerror=()=>finished(n);speechSynthesis.speak(u);guard=setTimeout(()=>finished(n),Math.min(19000,Math.max(5000,t.length*90)))}catch(e){note('Speaker: '+e.message);finished(n)}}let lastTopic='',callerName='',questionCount=0,lastReply='';
function choose(options){const next=options[questionCount%options.length];return next===lastReply?options[(questionCount+1)%options.length]:next}
function reply(t){
 const v=t.toLowerCase().replace(/[!?.,]/g,' ').replace(/\s+/g,' ').trim();
 const has=(r)=>r.test(v);let answer='';
 const nameMatch=t.match(/(?:my name is|this is|i'm called|call me)\s+([a-z]{2,18})/i);
 if(nameMatch)callerName=nameMatch[1];
 const who=callerName?', '+callerName:'';
 // Respond to what someone actually said before asking for business details.
 if(has(/\b(how are you|how's it going|how are things|you doing alright|how do you do)\b/)){
   answer=choose(["Hey there! I'm doing well, thanks for asking. How are you?","I'm good, thank you! How's your day going?","Hey! All good here. How about yourself?"]);
 }else if(has(/\b(what's up|wassup|sup)\b/)){
   answer=choose(["Hey! Not much, just here to help. What's up with you?","Hey there! How's your day going?"]);
 }else if(has(/\b(i'm good|i am good|doing well|pretty good|not bad|all good|i'm fine|i am fine)\b/) && !has(/\b(quote|book|price)\b/)){
   answer=choose(["Glad to hear it! What can I do for you?","That's good to hear! Anything I can help you with today?"]);
 }else if(has(/\b(not great|not good|terrible|rough day|bad day)\b/)){
   answer="Ah, sorry to hear that. Is there anything I can help you sort out?";
 }else if(has(/^(hi|hey|hello|hiya|good morning|good afternoon|good evening|g'day|yo)( there)?$/)){
   answer=choose(["Hey there! How's your day going?","Hi! Lovely to hear from you. How can I help?","Hey! How are you doing today?"]);
 }else if(has(/\b(are you a real person|are you human|are you ai|are you a robot|who am i speaking to|who are you)\b/)){
   answer="I'm QuotePilot, a virtual receptionist. I can have a chat and help with enquiries. What can I do for you?";
 }else if(has(/\b(your name|what do i call you)\b/)){
   answer="You can call me QuotePilot. And what should I call you?";
 }else if(has(/\b(quote|pricing|price|estimate|cost|how much)\b/)){
   lastTopic='quote';
   answer=has(/\b(lawn|mow|garden|landscap)\b/)?"Absolutely! Are you after regular garden maintenance, or is it more of a one-off job?":has(/\b(repair|fix|broken)\b/)?"Sure thing. What's happened, and what needs fixing?":"Yeah, of course. Tell me a bit about the job, and we'll take it from there.";
 }else if(has(/\b(book|booking|appointment|schedule|availability)\b/)){
   lastTopic='booking';answer="Sure, I can help with that. What would you like to book, and when were you thinking?";
 }else if(has(/\b(opening|open today|hours|closing time|weekend hours)\b/)){
   answer="I'd be happy to check, but this demo hasn't been connected to a business's hours yet. Can I help with anything else?";
 }else if(has(/\b(human|real person|staff member|manager|speak to someone)\b/)){
   answer="Absolutely. When this is connected to a business, I can pass along a message. What would you like me to tell them?";
 }else if(has(/\b(thank you|thanks|cheers|appreciate it)\b/)){
   answer=choose(["You're so welcome"+who+"! Anything else I can help with?","No worries at all! Is there anything else you need?"]);
 }else if(has(/\b(goodbye|bye|see you|that's all|that is all|nothing else)\b/)){
   answer="No worries. Thanks for calling"+who+". Have a great rest of your day!";
 }else if(lastTopic==='quote' && has(/\b(next week|tomorrow|today|monday|tuesday|wednesday|thursday|friday|saturday|sunday|soon|next month)\b/)){
   answer="That should give us a good starting point. What's the best way for the business to contact you about it?";
 }else if(lastTopic==='booking' && has(/\b(morning|afternoon|evening|monday|tuesday|wednesday|thursday|friday|saturday|sunday|tomorrow)\b/)){
   answer="Sounds good. I can't confirm a real booking in this demo, but I can help take down the details. What name should it be under?";
 }else if(has(/^(yes|yep|yeah|sure|okay|ok|sounds good)$/)){
   answer=lastTopic==='quote'?"Great! When were you hoping to get it done?":lastTopic==='booking'?"Lovely. Would you prefer morning or afternoon?":"Great! What can I help you with?";
 }else if(has(/^(no|nope|nah|not really)$/)){
   answer="No worries at all. What would work better for you?";
 }else if(nameMatch){
   answer="Nice to meet you, "+callerName+"! How can I help you today?";
 }else if(v.length<12){
   answer=choose(["Sure, tell me a little more.","Okay, I'm listening. Go on."]);
 }else{
   answer=choose(["Right, I see. What would you like to do next?","Got you. Could you tell me a little more about that?","That makes sense. What would be most helpful from here?"]);
 }
 lastReply=answer;questionCount++;speak(answer);
}
function listen(){if(!active||speaking||listening)return;if(!SR){set('Speech recognition unavailable','Try the latest Chrome version.');note('This browser does not support SpeechRecognition');return}let r;try{r=new SR();rec=r;r.lang='en-NZ';r.continuous=false;r.interimResults=false;listening=true;set('Starting microphone…','Allow microphone access if Chrome asks');r.onstart=()=>{if(rec!==r)return;tries=0;set('Listening…','Speak now');$('orb').classList.add('active')};r.onresult=e=>{if(rec!==r||!active)return;let v=e.results[e.resultIndex]?.[0]?.transcript?.trim();if(!v)return;rec=null;listening=false;r.onend=r.onerror=null;try{r.stop()}catch(e){}$('orb').classList.remove('active');log('You',v);reply(v)};r.onerror=e=>{if(rec!==r)return;note('Speech recognition: '+e.error);if(['not-allowed','service-not-allowed','audio-capture','network'].includes(e.error)){stopRec();set('Microphone problem',e.error==='not-allowed'?'Chrome denied microphone access. Allow it in Site settings.':'Speech recognition error: '+e.error);return}};r.onend=()=>{if(rec!==r)return;rec=null;listening=false;$('orb').classList.remove('active');if(!active||speaking)return;if(++tries<=3)later(800);else set('Tap Talk Again','Chrome stopped recognition; tap to restart.')};r.start()}catch(e){listening=false;rec=null;set('Cannot use microphone','Open the website in Chrome over HTTPS.');note(e.name+': '+e.message)}}function start(){if(active)return;active=true;tries=0;buttons();note('Secure context: '+isSecureContext+'; browser voice support: '+!!SR);callerName='';lastTopic='';questionCount=0;speak('Hi! Thanks for calling. How can I help you today?');if(!window.speechSynthesis)note('Browser does not support speech playback')}function stop(){active=false;turn++;clearTimeout(timer);clearTimeout(guard);stopRec();try{speechSynthesis.cancel()}catch(e){}speaking=false;$('orb').classList.remove('active');buttons();set('Call ended','Press Start Conversation to try again')}function again(){clearTimeout(timer);clearTimeout(guard);try{speechSynthesis.cancel()}catch(e){}turn++;speaking=false;stopRec();tries=0;listen()}$('start').onclick=start;$('end').onclick=stop;$('talk').onclick=again;$('send').onclick=()=>{let v=$('message').value.trim();if(!v)return;$('message').value='';if(!active){active=true;buttons()}clearTimeout(timer);clearTimeout(guard);try{speechSynthesis.cancel()}catch(e){}speaking=false;stopRec();log('You',v);reply(v)};$('message').onkeydown=e=>{if(e.key==='Enter')$('send').click()};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installer=e;$('install').hidden=false;$('installhelp').textContent='Add QuotePilot to your home screen.'});$('install').onclick=async()=>{if(!installer)return;let p=installer;installer=null;$('install').hidden=true;await p.prompt()};window.addEventListener('appinstalled',()=>{$('installhelp').textContent='QuotePilot installed.'});if('serviceWorker'in navigator && location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>note('Offline: '+e.message)));
})();
</script></body></html>
